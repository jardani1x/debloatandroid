[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanyourphone"
version = "1.0.0"
description = "A safety-first, reversible Android smartphone debloating and optimization framework"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "junyi", email = "junyi90@outlook.sg" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities"
]

[project.scripts]
cleanyourphone = "cleanyourphone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
